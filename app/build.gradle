plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def openAiApiKey = localProperties.getProperty('OPENAI_API_KEY', '')
def openAiModel = localProperties.getProperty('OPENAI_MODEL', 'gpt-5.6-terra')

android {
    namespace 'com.fieldscanner.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.fieldscanner.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests {
            // Required by the Robolectric startup smoke test (TASK-020) so it can
            // inflate activity_main and the app theme from merged resources.
            includeAndroidResources = true
        }
    }
    defaultConfig {
        buildConfigField 'String', 'OPENAI_MODEL', "\"${openAiModel}\""
        buildConfigField 'String', 'OPENAI_API_KEY', "\"${openAiApiKey}\""
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.1'
    // Supports minSdk 21 and works with this AGP 8.0 / Kotlin 1.8 project.
    implementation 'androidx.camera:camera-core:1.2.3'
    implementation 'androidx.camera:camera-camera2:1.2.3'
    implementation 'androidx.camera:camera-lifecycle:1.2.3'
    implementation 'androidx.camera:camera-view:1.2.3'
    implementation 'androidx.room:room-runtime:2.5.2'
    implementation 'androidx.room:room-ktx:2.5.2'
    kapt 'androidx.room:room-compiler:2.5.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'
    // Local JVM runtime for the app-startup smoke test (TASK-020). 4.10.3 is the
    // last line that targets SDK 33 / AGP 8.0; it fetches android-all-*.jar from
    // the network on the first run of a fresh machine or worktree.
    testImplementation 'org.robolectric:robolectric:4.10.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
